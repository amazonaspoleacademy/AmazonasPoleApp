 let role='student';$$('.seg button').forEach(b=>b.onclick=()=>{$$('.seg button').forEach(x=>x.classList.remove('active'));b.classList.add('active');role=b.dataset.role;$('#email').value=role==='owner'?'':role==='teacher'?'':'fbalbouze@gmail.com'});

function shell(){let u=me();let items=navItems(u.role);return `<div class="app"><header class="top"><div class="topin"><div class="brand"><div class="mark">A</div><span>Amazonas Pole Academy</span></div><div class="spacer"></div><span class="pill">${u.role==='owner'?'Panel administrador':u.role==='teacher'?'Panel instructor/asora':'Hola, '+esc(u.name)}</span><button class="btn ghost" id="logout">Salir</button></div></header><div class="layout"><aside class="side">${items.map(i=>`<button class="navbtn ${current===i[0]?'active':''}" data-nav="${i[0]}">${i[1]}</button>`).join('')}</aside><main class="content" id="page"></main></div><nav class="mobilebar">${items.slice(0,5).map(i=>`<button class="${current===i[0]?'active':''}" data-nav="${i[0]}">${i[1]}</button>`).join('')}</nav></div>`}
function bindNav(){$$('[data-nav]').forEach(b=>b.onclick=()=>{current=b.dataset.nav;renderPage()});$('#logout').onclick=()=>{session=null;localStorage.removeItem('amazonas_session');login()}}
function render(){if(!session||!me())return login();document.getElementById('root').innerHTML=shell();bindNav();renderPage()}
function renderPage(){let p=$('#page');if(!p)return;let role=me().role;let fn=pages[current]||pages[role==='owner'?'owner':role==='teacher'?'teacher':'home'];p.innerHTML=fn();bindPage();$$('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===current))}
function nextClassDateTime(c){
  const dayMap={'Domingo':0,'Lunes':1,'Martes':2,'Miércoles':3,'Jueves':4,'Viernes':5,'Sábado':6};
  let now=new Date();
  let targetDay=dayMap[c.day];
  let [hh,mm]=c.time.split(':').map(Number);
  let target=new Date(now);
  target.setHours(hh,mm,0,0);

  let delta=(targetDay-now.getDay()+7)%7;
  target.setDate(now.getDate()+delta);

  if(delta===0 && target<=now){
    target.setDate(target.getDate()+7);
  }

  return target;
}

function reservationClassDateTime(r,c){
  if(r.classDateTime){
    let d=new Date(r.classDateTime);
    if(!isNaN(d))return d;
  }
  return nextClassDateTime(c);
}

function hoursUntilReservation(r,c){
  return (reservationClassDateTime(r,c).getTime()-Date.now())/3600000;
}

function countClass(cid){return db.reservations.filter(r=>r.classId===cid&&r.status==='confirmed').length}
function myReservations(){return db.reservations.filter(r=>r.userId===me().id)}
function classCard(c,student=false){let n=countClass(c.id),full=n>=c.capacity, mine=db.reservations.find(r=>r.userId===me().id&&r.classId===c.id&&r.status==='confirmed');return `<div class="classrow"><div class="time">${c.time}</div><div><b>${esc(c.activity)}</b><div class="muted">con ${esc(c.teacher)} · ${n}/${c.capacity} cupos</div></div>${student?`<div class="actions">${mine?`<button class="btn bad" data-cancel="${mine.id}">Cancelar</button>`:`<button class="btn ${full?'ghost':'primary'}" data-reserve="${c.id}" ${full?'disabled':''}>${full?'Completa':'Reservar'}</button>`}</div>`:''}</div>`}

function teacherBookings(){let ids=db.classes.filter(c=>c.teacher.toLowerCase().includes(me().name.toLowerCase())).map(c=>c.id);return db.reservations.filter(r=>ids.includes(r.classId)&&r.status==='confirmed').length}
function scanPage(title){return `<div class="sectionhead"><div><div class="eyebrow">Asistencia</div><h2>${title}</h2></div></div><div class="card" style="max-width:600px"><p class="muted">Ingresá el código que aparece en la credencial de la estudiante.</p><form class="form" id="scanForm"><label>Código de credencial<input id="scanCode" placeholder="U1-..." required></label><button class="btn primary">Registrar asistencia</button></form><div class="notice" style="margin-top:14px">En producción este módulo puede conectarse con la cámara del teléfono. Esta copia funcional usa el mismo token de la credencial para validar la asistencia.</div></div>`}
function checksum(s){let n=0;for(let c of s)n=(n*31+c.charCodeAt(0))%997;return String(n).padStart(3,'0')}
function qrDraw(){let q=$('#qr');if(!q)return;let token=me().id+'-'+checksum(me().id),bits=[];let seedN=[...token].reduce((a,c)=>a+c.charCodeAt(0),0);for(let i=0;i<441;i++){seedN=(seedN*9301+49297)%233280;bits.push(seedN/233280>.5)};for(let y=0;y<21;y++)for(let x=0;x<21;x++){let i=document.createElement('i');let finder=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);let on=finder?((x%6===0||y%6===0||((x%6>=2&&x%6<=4)&&(y%6>=2&&y%6<=4)))):bits[y*21+x];if(on)i.className='on';q.append(i)}}
function modal(html){let m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modalbox">${html}</div>`;m.onclick=e=>{if(e.target===m)m.remove()};document.body.append(m);return m}
function paymentModal(){
  let m=modal(`<div class="sectionhead"><div><div class="eyebrow">Nuevo pago</div><h2>Registrar un pago</h2></div><button class="btn ghost" id="closeM">×</button></div><form class="form" id="payForm"><label>Abono<select id="payPlan">${db.plans.map((p,i)=>`<option value="${i}">${p.name} · ${money(p.amount)}</option>`).join('')}</select></label><label>Método<select id="payMethod"><option>Transferencia</option><option>Efectivo</option></select></label><label>Comprobante (imagen o PDF)<input id="receipt" type="file" accept="image/*,application/pdf"></label><div class="notice">Para transferencias, el comprobante es obligatorio. En esta versión debe pesar menos de 700 KB.</div><button class="btn primary">Enviar para aprobación</button></form>`);
  m.querySelector('#closeM').onclick=()=>m.remove();
  m.querySelector('#payForm').onsubmit=e=>{
    e.preventDefault();
    let p=db.plans[+m.querySelector('#payPlan').value];
    let method=m.querySelector('#payMethod').value;
    let file=m.querySelector('#receipt').files[0];

    if(method==='Transferencia'&&!file)return toast('Adjuntá el comprobante de la transferencia');

    let finish=receipt=>{
      let payment={id:'p'+Date.now(),userId:me().id,plan:p.name,amount:p.amount,method,date:new Date().toISOString().slice(0,10),status:'pending',receipt,credits:p.credits};
      db.payments.unshift(payment);
      try{
        save();
        let persisted=JSON.parse(localStorage.getItem(LS)||'{}');
        let saved=(persisted.payments||[]).find(x=>x.id===payment.id);
        if(!saved||(receipt&&!saved.receipt)){
          db.payments=db.payments.filter(x=>x.id!==payment.id);
          save();
          return toast('No se pudo guardar el comprobante. Probá con un archivo más liviano.');
        }
        m.remove();
        toast('Pago y comprobante registrados. Quedan pendientes de aprobación.');
        renderPage();
      }catch(err){
        db.payments=db.payments.filter(x=>x.id!==payment.id);
        try{save()}catch(e){}
        toast('No se pudo guardar el comprobante. Probá con un archivo más liviano.');
      }
    };

    if(file){
      if(file.size>700000)return toast('El comprobante debe pesar menos de 700 KB en esta versión.');
      let rd=new FileReader();
      rd.onerror=()=>toast('No se pudo leer el comprobante');
      rd.onload=()=>finish(rd.result);
      rd.readAsDataURL(file);
    }else finish('');
  };
}

function receiptModal(paymentId){
  let p=db.payments.find(x=>x.id===paymentId);
  if(!p||!p.receipt)return toast('No hay comprobante disponible');

  let isPdf=String(p.receipt).startsWith('data:application/pdf');
  let m=modal(`
    <div class="sectionhead">
      <div><div class="eyebrow">Comprobante</div><h2>${esc(p.plan)}</h2></div>
      <button class="btn ghost" id="closeReceipt">×</button>
    </div>
    ${isPdf
      ? `<iframe src="${p.receipt}" style="width:100%;height:65vh;border:1px solid var(--line);border-radius:12px"></iframe>`
      : `<img src="${p.receipt}" alt="Comprobante" style="display:block;max-width:100%;max-height:70vh;margin:auto;border-radius:12px;border:1px solid var(--line)">`
    }
    <div class="actions" style="margin-top:14px">
      <a class="btn soft" href="${p.receipt}" target="_blank" rel="noopener">Abrir en otra pestaña</a>
    </div>
  `);
  m.querySelector('#closeReceipt').onclick=()=>m.remove();
}

function classModal(c){let editing=!!c,m=modal(`<div class="sectionhead"><div><div class="eyebrow">Horario</div><h2>${editing?'Editar':'Nueva'} clase</h2></div><button class="btn ghost" id="closeM">×</button></div><form class="form" id="classForm"><label>Día<select id="cDay">${['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'].map(d=>`<option ${c?.day===d?'selected':''}>${d}</option>`).join('')}</select></label><label>Hora<input id="cTime" type="time" value="${c?.time||'18:30'}" required></label><label>Actividad<input id="cAct" value="${esc(c?.activity||'Pole Sport')}" required></label><label>Instructor/asora<input id="cTeacher" value="${esc(c?.teacher||'')}" required></label><label>Cupo<input id="cCap" type="number" min="1" max="30" value="${c?.capacity||6}" required></label><button class="btn primary">Guardar</button></form>`);m.querySelector('#closeM').onclick=()=>m.remove();m.querySelector('#classForm').onsubmit=e=>{e.preventDefault();let obj={day:m.querySelector('#cDay').value,time:m.querySelector('#cTime').value,activity:m.querySelector('#cAct').value,teacher:m.querySelector('#cTeacher').value,capacity:+m.querySelector('#cCap').value,active:true};if(editing)Object.assign(c,obj);else db.classes.push({id:'c'+Date.now(),...obj});save();m.remove();toast('Horario guardado');renderPage()}}
function classStudentsModal(classId){

  let reservations=db.reservations.filter(
    r=>r.classId===classId && r.status==='confirmed'

  let students=reservations.map(r=>{
    let u=db.users.find(x=>x.id===r.userId);
    return {reservation:r,user:u};
  }).filter(x=>x.user);

  let m=modal(`
    <div class="sectionhead">
      <div>
        <div class="eyebrow">${c.day} · ${c.time}</div>
        <h2>${esc(c.activity)}</h2>

          ${esc(c.teacher)} · ${students.length}/${c.capacity} lugares ocupados
        </div>
      </div>
      <button class="btn ghost" id="closeStudents">×</button>
    </div>

    ${
      students.length
      ? `<div class="list">
          ${students.map(({user,reservation})=>`
            <div class="item">
              <div class="profile">
                <div class="avatar">${esc(user.name.charAt(0))}</div>
                <div>
                  <b>${esc(user.name)} ${esc(user.last||'')}</b>
                  <div class="muted">${esc(user.email||'')}</div>
                  ${user.phone ? `<div class="muted">${esc(user.phone)}</div>` : ''}
                </div>
              </div>
              <span class="badge ${reservation.attendance?'ok':'warn'}">
                ${reservation.attendance?'Asistió':'Reservada'}
              </span>
            </div>
          `).join('')}
        </div>`
      : `<div class="empty">Todavía no hay estudiantes anotadas en esta clase.</div>`
    }

    <div class="notice" style="margin-top:16px">
      <b>${students.length}</b> de <b>${c.capacity}</b> lugares ocupados ·
      <b>${c.capacity-students.length}</b> disponibles.
    </div>
  `);

  m.querySelector('#closeStudents').onclick=()=>m.remove();
}


function splitStudentName(full=''){
  let parts=String(full).trim().split(/\s+/).filter(Boolean);
  return {
    name: parts.shift()||'',
    last: parts.join(' ')
  };
}

function studentModal(u=null){
  let editing=!!u;
  let m=modal(`
    <div class="sectionhead">
      <div>
        <div class="eyebrow">Estudiantes</div>
        <h2>${editing?'Editar estudiante':'Registrar estudiante'}</h2>
      </div>
      <button class="btn ghost" id="closeStudentM">×</button>
    </div>

    <form class="form" id="studentForm">
      <label>Nombre y apellido
        <input id="sFullName" value="${esc(editing?`${u.name||''} ${u.last||''}`.trim():'')}" required>
      </label>

      <label>Dirección
        <input id="sAddress" value="${esc(u?.address||'')}">
      </label>

      <label>DNI o pasaporte
        <input id="sDocument" value="${esc(u?.document||'')}" required>
      </label>

      <label>Fecha de nacimiento
        <input id="sBirthdate" type="date" value="${esc(u?.birthdate||'')}">
      </label>

      <label>Email
        <input id="sEmail" type="email" value="${esc(u?.email||'')}" required>
      </label>

      <label>Teléfono
        <input id="sPhone" value="${esc(u?.phone||'')}" required>
      </label>

      <div class="grid g2">
        <label>Contacto de emergencia · Nombre
          <input id="sEmergencyName" value="${esc(u?.emergencyName||'')}">
        </label>

        <label>Contacto de emergencia · Teléfono
          <input id="sEmergencyPhone" value="${esc(u?.emergencyPhone||'')}">
        </label>
      </div>

      <label>Fecha de inicio
        <input id="sStartDate" type="date" value="${esc(u?.startDate||new Date().toISOString().slice(0,10))}" required>
      </label>

      <label>Instagram
        <input id="sInstagram" value="${esc(u?.instagram||'')}" placeholder="@usuario">
      </label>

      <label>${editing?'Nueva contraseña (dejá vacío para conservar la actual)':'Contraseña inicial'}
        <input id="sPass" type="password" ${editing?'':'required'}>
      </label>

      <div class="grid g2">
        <label>Abono
          <select id="sPlan">
            <option value="">Sin abono</option>
            ${db.plans.map(p=>`<option value="${esc(p.name)}" ${u?.plan===p.name?'selected':''}>${esc(p.name)}</option>`).join('')}
          </select>
        </label>

        <label>Créditos
          <input id="sCredits" type="number" min="0" value="${u?.credits??0}">
        </label>
      </div>

      <label>Vencimiento del abono
        <input id="sExpires" type="date" value="${esc(u?.expires||'')}">
      </label>

      <button class="btn primary">${editing?'Guardar cambios':'Registrar estudiante'}</button>
    </form>
  `);

  m.querySelector('#closeStudentM').onclick=()=>m.remove();

  m.querySelector('#studentForm').onsubmit=e=>{
    e.preventDefault();

    let full=splitStudentName(m.querySelector('#sFullName').value);
    let email=m.querySelector('#sEmail').value.trim().toLowerCase();

    let duplicate=db.users.find(x=>x.email.toLowerCase()===email && (!editing || x.id!==u.id));
    if(duplicate)return toast('Ya existe una cuenta con ese email');

    let data={
      role:'student',
      name:full.name,
      last:full.last,
      address:m.querySelector('#sAddress').value.trim(),
      document:m.querySelector('#sDocument').value.trim(),
      birthdate:m.querySelector('#sBirthdate').value,
      email,
      phone:m.querySelector('#sPhone').value.trim(),
      emergencyName:m.querySelector('#sEmergencyName').value.trim(),
      emergencyPhone:m.querySelector('#sEmergencyPhone').value.trim(),
      startDate:m.querySelector('#sStartDate').value,
      instagram:m.querySelector('#sInstagram').value.trim(),
      plan:m.querySelector('#sPlan').value,
      credits:+m.querySelector('#sCredits').value||0,
      expires:m.querySelector('#sExpires').value
    };

    let password=m.querySelector('#sPass').value;

    if(editing){
      Object.assign(u,data);
      if(password)u.pass=password;
    }else{
      db.users.push({
        id:'u'+Date.now(),
        ...data,
        pass:password
      });
    }

    save();
    m.remove();
    toast(editing?'Estudiante actualizada':'Estudiante registrada');
    renderPage();
  };
}

function viewStudentModal(userId){
  let u=db.users.find(x=>x.id===userId && x.role==='student');
  if(!u)return;

  let activeReservations=db.reservations.filter(r=>r.userId===u.id && r.status==='confirmed');
  let m=modal(`
    <div class="sectionhead">
      <div>
        <div class="eyebrow">Ficha del estudiante</div>
        <h2>${esc(u.name)} ${esc(u.last||'')}</h2>
      </div>
      <button class="btn ghost" id="closeViewStudent">×</button>
    </div>

    <div class="list">
      <div class="item"><span>Dirección</span><b>${esc(u.address||'—')}</b></div>
      <div class="item"><span>DNI o pasaporte</span><b>${esc(u.document||'—')}</b></div>
      <div class="item"><span>Fecha de nacimiento</span><b>${esc(u.birthdate||'—')}</b></div>
      <div class="item"><span>Email</span><b>${esc(u.email||'—')}</b></div>
      <div class="item"><span>Teléfono</span><b>${esc(u.phone||'—')}</b></div>
      <div class="item"><span>Contacto de emergencia</span><b>${esc(u.emergencyName||'—')} ${u.emergencyPhone?`· ${esc(u.emergencyPhone)}`:''}</b></div>
      <div class="item"><span>Fecha de inicio</span><b>${esc(u.startDate||'—')}</b></div>
      <div class="item"><span>Instagram</span><b>${esc(u.instagram||'—')}</b></div>
      <div class="item"><span>Abono</span><b>${esc(u.plan||'Sin abono')}</b></div>
      <div class="item"><span>Créditos</span><b>${u.credits||0}</b></div>
      <div class="item"><span>Vencimiento</span><b>${esc(u.expires||'—')}</b></div>
      <div class="item"><span>Reservas activas</span><b>${activeReservations.length}</b></div>
    </div>

    <div class="actions" style="margin-top:16px">
      <button class="btn primary" id="editFromView">Editar estudiante</button>
    </div>
  `);

  m.querySelector('#closeViewStudent').onclick=()=>m.remove();
  m.querySelector('#editFromView').onclick=()=>{
    m.remove();
    studentModal(u);
  };
}


function planModal(index=null){
  let editing=index!==null;
  let p=editing?db.plans[index]:null;

  let m=modal(`
    <div class="sectionhead">
      <div>
        <div class="eyebrow">Planes y precios</div>
        <h2>${editing?'Editar plan':'Agregar plan'}</h2>
      </div>
      <button class="btn ghost" id="closePlanM">×</button>
    </div>

    <form class="form" id="planForm">
      <label>Nombre del plan
        <input id="planName" value="${esc(p?.name||'')}" placeholder="Ej: Abono 8 clases" required>
      </label>

      <label>Precio
        <input id="planAmount" type="number" min="0" step="1" value="${p?.amount??0}" required>
      </label>

      <label>Créditos / clases
        <input id="planCredits" type="number" min="1" step="1" value="${p?.credits??1}" required>
      </label>

      <button class="btn primary">${editing?'Guardar cambios':'Agregar plan'}</button>
    </form>
  `);

  m.querySelector('#closePlanM').onclick=()=>m.remove();

  m.querySelector('#planForm').onsubmit=e=>{
    e.preventDefault();

    let data={
      name:m.querySelector('#planName').value.trim(),
      amount:+m.querySelector('#planAmount').value||0,
      credits:+m.querySelector('#planCredits').value||1
    };

    if(editing){
      db.plans[index]=data;
    }else{
      db.plans.push(data);
    }

    save();
    m.remove();
    toast(editing?'Plan actualizado':'Plan agregado');
    renderPage();
  };
}

function bindPage(){
 $('#newPlan')&&($('#newPlan').onclick=()=>planModal(null));
 $$('[data-editplan]').forEach(b=>b.onclick=()=>planModal(+b.dataset.editplan));
 $$('[data-deleteplan]').forEach(b=>b.onclick=()=>{
   let i=+b.dataset.deleteplan;
   let p=db.plans[i];
   if(!p)return;
   if(!confirm(`¿Eliminar el plan "${p.name}"?`))return;
   db.plans.splice(i,1);
   save();
   toast('Plan eliminado');
   renderPage();
 });

 $$('[data-viewreceipt]').forEach(b=>b.onclick=()=>receiptModal(b.dataset.viewreceipt));
 $('#newStudent')&&($('#newStudent').onclick=()=>studentModal(null));
 $$('[data-viewstudent]').forEach(b=>b.onclick=()=>viewStudentModal(b.dataset.viewstudent));
 $$('[data-editstudent]').forEach(b=>b.onclick=()=>studentModal(db.users.find(u=>u.id===b.dataset.editstudent)));
$$('[data-viewstudents]').forEach(b=>{
  b.onclick=()=>classStudentsModal(b.dataset.viewstudents);
});
 $$('[data-nav]').forEach(b=>b.onclick=()=>{current=b.dataset.nav;renderPage()});
 $$('[data-day]').forEach(b=>b.onclick=()=>{day=b.dataset.day;renderPage()});
 $$('[data-reserve]').forEach(b=>b.onclick=()=>{let u=me();if((u.credits||0)<1)return toast('Necesitás un abono con clases disponibles');let cid=b.dataset.reserve,c=db.classes.find(x=>x.id===cid);if(countClass(cid)>=c.capacity)return toast('La clase ya está completa');db.reservations.push({id:'r'+Date.now(),userId:u.id,classId:cid,status:'confirmed',attendance:false,created:new Date().toISOString().slice(0,10),classDateTime:nextClassDateTime(c).toISOString()});u.credits--;save();toast('Reserva confirmada');renderPage()});
 $$('[data-cancel]').forEach(b=>b.onclick=()=>{
  let r=db.reservations.find(x=>x.id===b.dataset.cancel);
  if(!r||r.status!=='confirmed')return;

  let c=db.classes.find(x=>x.id===r.classId);
  if(!c)return toast('No se encontró la clase de esta reserva');

  let hours=hoursUntilReservation(r,c);
  let refund=hours>=24;

  if(!refund){
    let ok=confirm('Faltan menos de 24 horas para la clase. Si cancelás ahora, el crédito se pierde y no será reintegrado. ¿Querés cancelar igualmente?');
    if(!ok)return;
  }

  r.status='cancelled';
  r.cancelledAt=new Date().toISOString();
  r.creditRefunded=refund;

  if(refund){
    me().credits=(me().credits||0)+1;
  }

  save();
  toast(refund
    ? 'Reserva cancelada. Recuperaste 1 crédito.'
    : 'Reserva cancelada fuera de término. El crédito no se reintegró.'
  );
  renderPage();
});
 $('#newPayment')&&($('#newPayment').onclick=paymentModal);qrDraw();
 $('#profileForm')&&($('#profileForm').onsubmit=e=>{e.preventDefault();Object.assign(me(),{name:$('#pfName').value,last:$('#pfLast').value,phone:$('#pfPhone').value});save();toast('Datos actualizados');render()});
 $$('[data-approve]').forEach(b=>b.onclick=()=>{let p=db.payments.find(x=>x.id===b.dataset.approve),u=db.users.find(x=>x.id===p.userId);p.status='approved';u.credits=(u.credits||0)+(p.credits||0);u.plan=p.plan;let d=new Date();d.setDate(d.getDate()+30);u.expires=d.toISOString().slice(0,10);save();toast('Pago aprobado y abono activado');renderPage()});
 $$('[data-reject]').forEach(b=>b.onclick=()=>{let p=db.payments.find(x=>x.id===b.dataset.reject);p.status='rejected';save();toast('Pago rechazado');renderPage()});
 $('#newClass')&&($('#newClass').onclick=()=>classModal(null));$$('[data-editclass]').forEach(b=>b.onclick=()=>classModal(db.classes.find(x=>x.id===b.dataset.editclass)));$$('[data-toggleclass]').forEach(b=>b.onclick=()=>{let c=db.classes.find(x=>x.id===b.dataset.toggleclass);c.active=!c.active;save();renderPage()});
 $('#studioForm')&&($('#studioForm').onsubmit=e=>{e.preventDefault();Object.assign(db.studio,{owner:$('#stOwner').value,alias:$('#stAlias').value,cbu:$('#stCbu').value,whatsapp:$('#stWa').value,instagram:$('#stIg').value,address:$('#stAddr').value});save();toast('Datos del estudio guardados')});
 $('#newsForm')&&($('#newsForm').onsubmit=e=>{e.preventDefault();db.news.unshift({id:'n'+Date.now(),tag:$('#nTag').value,title:$('#nTitle').value,message:$('#nMsg').value,date:new Date().toISOString().slice(0,10)});save();toast('Novedad publicada');renderPage()});
 $('#addTeacher')&&($('#addTeacher').onclick=()=>{let m=modal(`<h2>Agregar instructor/asora</h2><form class="form" id="tForm"><label>Nombre<input id="tName" required></label><label>Disciplinas<input id="tDisc" required></label><button class="btn primary">Agregar</button></form>`);m.querySelector('#tForm').onsubmit=e=>{e.preventDefault();db.teachers.push({id:'t'+Date.now(),name:m.querySelector('#tName').value,disc:m.querySelector('#tDisc').value,role:'Instructor/a'});save();m.remove();renderPage()}});
 $('#scanForm')&&($('#scanForm').onsubmit=e=>{e.preventDefault();let code=$('#scanCode').value.trim().toLowerCase(),uid=code.split('-')[0],u=db.users.find(x=>x.id.toLowerCase()===uid&&x.role==='student');if(!u||code!==`${u.id}-${checksum(u.id)}`.toLowerCase())return toast('Credencial no válida');let rs=db.reservations.filter(r=>r.userId===u.id&&r.status==='confirmed'&&!r.attendance);if(!rs.length)return toast('El estudiante no tiene reservas pendientes de asistencia');let r=rs[0];r.attendance=true;db.attendance.push({id:'a'+Date.now(),userId:u.id,reservationId:r.id,teacherId:me().id,date:new Date().toISOString()});save();toast('Asistencia registrada para '+u.name);renderPage()});
}
render();
</script>
</body></html>
