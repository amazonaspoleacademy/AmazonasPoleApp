<html lang="es">capacity:()=>`<div class="sectionhead"
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Amazonas Pole Academy — App</title>
<style>
:root{--bg:#f7f9fc;--card:#fff;--ink:#172033;--muted:#687386;--line:#e7ebf2;--brand:#45a9dc;--brand2:#1f7fb5;--soft:#eaf6fc;--ok:#1f9d6a;--warn:#d68a13;--bad:#c94455;--nav:#102032;--shadow:0 10px 30px rgba(25,53,82,.09);--r:18px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.app{min-height:100vh}.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.topin{max-width:1180px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:14px}.brand{display:flex;align-items:center;gap:10px;font-weight:850}.mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,var(--brand),#87d3f6);display:grid;place-items:center;color:white;font-weight:900}.spacer{flex:1}.pill{border:1px solid var(--line);background:white;border-radius:999px;padding:8px 12px;color:var(--muted)}.layout{max-width:1180px;margin:auto;display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 64px)}.side{padding:18px 12px;border-right:1px solid var(--line);background:#fff}.navbtn{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:11px 12px;border-radius:12px;text-align:left;color:#526074;cursor:pointer;margin:2px 0}.navbtn:hover,.navbtn.active{background:var(--soft);color:var(--brand2);font-weight:760}.content{padding:26px;min-width:0}.hero{background:linear-gradient(135deg,#0f273a,#1b5f86 55%,#4cb4e5);color:white;border-radius:26px;padding:34px;box-shadow:var(--shadow);overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-80px;top:-90px;background:rgba(255,255,255,.12)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(30px,5vw,52px);line-height:1.03;margin-bottom:10px}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:12px;font-weight:850;color:var(--brand2)}.hero .eyebrow{color:#bceaff}.muted{color:var(--muted)}.grid{display:grid;gap:16px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 5px 20px rgba(25,53,82,.04)}.stat{font-size:30px;font-weight:900}.btn{border:0;border-radius:12px;padding:11px 14px;cursor:pointer;font-weight:780}.btn.primary{background:var(--brand2);color:white}.btn.soft{background:var(--soft);color:var(--brand2)}.btn.ghost{background:white;border:1px solid var(--line);color:var(--ink)}.btn.bad{background:#fff0f2;color:var(--bad)}.btn.ok{background:#e9f8f2;color:var(--ok)}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap}.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:6px 0 16px}.schedule{display:grid;gap:12px}.classrow{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;background:white}.time{font-size:22px;font-weight:900;color:var(--brand2)}.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;background:#eef2f7;color:#596679}.badge.ok{background:#e8f7f0;color:var(--ok)}.badge.warn{background:#fff4df;color:var(--warn)}.badge.bad{background:#ffedf0;color:var(--bad)}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:6px}.tab{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:999px;padding:9px 13px;cursor:pointer}.tab.active{background:var(--nav);color:white;border-color:var(--nav)}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:white}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{background:#f9fbfd;color:#6b778b;font-size:12px;text-transform:uppercase;letter-spacing:.05em}tr:last-child td{border-bottom:0}.form{display:grid;gap:12px}.form label{font-size:13px;font-weight:760;color:#566378}.form input,.form select,.form textarea{width:100%;border:1px solid #dfe5ee;background:white;border-radius:12px;padding:11px 12px;outline:none}.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(69,169,220,.12)}.form textarea{min-height:100px;resize:vertical}.modal{position:fixed;inset:0;z-index:99;background:rgba(8,20,34,.52);display:grid;place-items:center;padding:18px}.modalbox{width:min(540px,100%);max-height:90vh;overflow:auto;background:white;border-radius:22px;padding:22px;box-shadow:0 25px 80px rgba(0,0,0,.22)}.toast{position:fixed;right:18px;bottom:18px;z-index:120;background:#14283b;color:white;padding:12px 15px;border-radius:12px;box-shadow:var(--shadow);max-width:340px}.loginwrap{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr}.loginart{background:linear-gradient(145deg,#0f273a,#257daa 55%,#62c1e9);color:white;padding:7vw;display:flex;flex-direction:column;justify-content:center}.loginpanel{display:grid;place-items:center;padding:28px}.loginbox{width:min(440px,100%)}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#eef3f7;padding:5px;border-radius:14px;margin-bottom:18px}.seg button{border:0;background:transparent;border-radius:10px;padding:9px;font-weight:800;cursor:pointer}.seg button.active{background:white;box-shadow:0 3px 10px rgba(0,0,0,.06)}.qrbox{width:220px;height:220px;border:10px solid white;box-shadow:0 0 0 1px var(--line),var(--shadow);background:white;display:grid;grid-template-columns:repeat(21,1fr);grid-template-rows:repeat(21,1fr);gap:1px;padding:5px}.qrbox i{background:white}.qrbox i.on{background:#111}.mobilebar{display:none}.empty{padding:28px;text-align:center;color:var(--muted)}.notice{background:#eff8fd;border:1px solid #d8eef9;color:#245d7d;padding:12px 14px;border-radius:12px}.dangerbox{background:#fff1f3;border:1px solid #ffd5dc;color:#8f3041;padding:12px 14px;border-radius:12px}.nowrap{white-space:nowrap}.right{text-align:right}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--brand2);font-weight:900}.profile{display:flex;align-items:center;gap:12px}.list{display:grid;gap:10px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px;border:1px solid var(--line);border-radius:13px;background:white}.progress{height:8px;background:#edf1f6;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:var(--brand)}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:none}.content{padding:18px 14px 90px}.g3,.g2{grid-template-columns:1fr}.mobilebar{position:fixed;left:10px;right:10px;bottom:10px;z-index:60;display:grid;grid-template-columns:repeat(5,1fr);background:#102032;border-radius:18px;padding:7px;box-shadow:0 12px 35px rgba(0,0,0,.25)}.mobilebar button{border:0;background:transparent;color:#b7c3ce;font-size:10px;padding:8px 3px;border-radius:11px}.mobilebar button.active{background:#1c3850;color:white}.classrow{grid-template-columns:66px 1fr}.classrow>.actions{grid-column:1/-1}.topin .pill{display:none}.loginwrap{grid-template-columns:1fr}.loginart{display:none}.loginpanel{min-height:100vh}}
</style>

<body>
<div id="root"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const LS='amazonas_app_v1';
const seed={
 studio:{name:'Amazonas Pole Academy',alias:'amazonas.pole.mp',cbu:'0000003100070XXXXXX772',owner:'Amazonas Pole Academy',whatsapp:'+54 9 11 2610-6002',instagram:'@amazonaspoleacademy',facebook:'Amazonas Pole Academy',tiktok:'@amazonaspoleacademy',address:'Balvanera, CABA',hours:'Lun a sáb · consultar horarios'},
 users:[
  {id:'u1',role:'student',name:'Fabiola',last:'Balbouze',email:'fbalbouzecgmail.com',pass:'prueba123',phone:'11 2610 6002',credits:5,plan:'Abono 8 clases',expires:'2026-09-05'},
  {id:'o1',role:'owner',name:'Fabiola',last:'Balbouze',email:'',pass:'demo123',phone:'',credits:0},
  {id:'t1',role:'teacher',name:'Lara',last:'',email:'lara@amazonas.demo',pass:'demo123',phone:'',credits:0}
 ],
 teachers:[{id:'o1',name:'Fabiola Balbouze',disc:'Dirección · Pole Sport · Exotic',role:'Dueña'},{id:'t1',name:'Lara',disc:'Pole Yoga · Flexibilidad',role:'Profe'},{id:'t2',name:'Camila',disc:'Pole Sport · Exotic',role:'Profe'},{id:'t3',name:'Melody',disc:'Pole Sport',role:'Profe'},{id:'t4',name:'Anahí',disc:'Pole Sport · Exotic',role:'Profe'}],
 classes:[
  ['c1','Lunes','17:30','Pole Sport','Camila',6],['c2','Lunes','18:30','Pole Sport','Camila',6],['c3','Lunes','19:30','Pole Sport','Camila',6],['c4','Lunes','20:30','Exotic Pole','Camila',6],
  ['c5','Martes','12:00','Pole básico','Érica',6],['c6','Martes','18:30','Pole Sport','Melody',6],['c7','Martes','19:30','Flexibilidad','Fabiola',8],
  ['c8','Miércoles','09:00','Pole Yoga','Lara',6],['c9','Miércoles','10:00','Pole Sport','Lara',6],['c10','Miércoles','16:00','Pole Sport','Evelin',6],['c11','Miércoles','18:30','Pole Sport','Camila',6],['c12','Miércoles','19:30','Exotic Pole','Anahí',6],['c13','Miércoles','20:30','Pole Sport','Anahí',6],
  ['c14','Jueves','09:00','Pole Sport','Camila',6],['c15','Jueves','18:30','Pole Sport','Melody',6],['c16','Jueves','19:30','Pole Sport','Anahí',6],
  ['c17','Viernes','09:00','Pole Sport','Evelin',6],['c18','Viernes','17:30','Pole Sport','Érica',6],['c19','Viernes','18:30','Pole Sport','Érica',6],
  ['c20','Sábado','11:00','Pole Sport','Anahí',6],['c21','Sábado','12:00','Pole Sport','Anahí',6],['c22','Sábado','14:00','Pole Sport','Anahí',6]
 ].map(x=>({id:x[0],day:x[1],time:x[2],activity:x[3],teacher:x[4],capacity:x[5],active:true})),
 reservations:[{id:'r1',userId:'u1',classId:'c8',status:'confirmed',attendance:false,created:'2026-08-18'}],
 payments:[{id:'p1',userId:'u1',plan:'Abono 8 + 4 free',amount:150000,method:'Transferencia',date:'2026-08-18',status:'pending',receipt:'',credits:12},{id:'p2',userId:'u1',plan:'Abono 4 clases',amount:85000,method:'Efectivo',date:'2026-07-20',status:'approved',receipt:'',credits:4}],
 news:[{id:'n1',tag:'🔥',title:'Instructorado Pole Dance / Sport',message:'Cursada presencial y online. Consultá por cupos.',date:'2026-08-08'},{id:'n2',tag:'🩰',title:'Nuevo horario',message:'Sumamos nuevos horarios de Pole Sport y Exotic.',date:'2026-08-04'}],
 plans:[{name:'Clase suelta',amount:35000,credits:1},{name:'Abono 4 clases',amount:85000,credits:4},{name:'Abono 8 clases',amount:150000,credits:8}],
 attendance:[]
};
let db=load(), session=JSON.parse(localStorage.getItem('amazonas_session')||'null'), current='home', day='Lunes';
function load(){try{return JSON.parse(localStorage.getItem(LS))||structuredClone(seed)}catch(e){return structuredClone(seed)}}
function save(){localStorage.setItem(LS,JSON.stringify(db))}
function toast(msg){let t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),2600)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function money(n){return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n)}
function me(){return db.users.find(u=>u.id===session?.userId)}
function navItems(role){if(role==='student')return [['home','Inicio'],['schedule','Horarios'],['reservations','Mis Reservas'],['payments','Abonos y Pagos'],['news','Actividades'],['account','Mi cuenta'],['credential','Mi credencial'],['transfer','Transferencia']];if(role==='owner')return [['owner','Resumen'],['approve','Aprobar pagos'],['capacity','Cupos por clase'],['manage','Gestionar horarios'],['students','Alumnas'],['studio','Datos del estudio'],['scan','Escanear QR'],['publish','Enviar novedad'],['teachers','Profesoras']];return [['teacher','Resumen'],['myclasses','Mis clases'],['attendance','Tomar asistencia']];}
function login(){
 document.getElementById('root').innerHTML=`<div class="loginwrap"><section class="loginart"><div class="eyebrow">Amazonas Pole Academy</div><h1>Tu academia, también digital.</h1><p style="font-size:18px;max-width:560px;color:#d9effa">Reservas, abonos, pagos, asistencia y gestión en un solo lugar.</p></section><section class="loginpanel"><div class="loginbox"><div class="brand" style="margin-bottom:22px"><div class="mark">A</div> Amazonas Pole Academy</div><div class="seg"><button class="active" data-role="student">Alumna</button><button data-role="owner">Dueña</button><button data-role="teacher">Profe</button></div><form id="loginForm" class="form"><label>Email<input id="email" type="email" value="" required></label><label>Contraseña<input id="pass" type="password" value="" required></label><button class="btn primary">Ingresar</button></form></div></div></section></div>`;
 let role='student';$$('.seg button').forEach(b=>b.onclick=()=>{$$('.seg button').forEach(x=>x.classList.remove('active'));b.classList.add('active');role=b.dataset.role;$('#email').value=role==='owner'?'':role==='teacher'?'':'fbalbouze@gmail.com'});
 $('#loginForm').onsubmit=e=>{e.preventDefault();let u=db.users.find(x=>x.email.toLowerCase()===$('#email').value.toLowerCase()&&x.pass===$('#pass').value&&x.role===role);if(!u)return toast('Credenciales incorrectas para ese rol');session={userId:u.id,role:u.role};localStorage.setItem('amazonas_session',JSON.stringify(session));current=u.role==='student'?'home':u.role==='owner'?'owner':'teacher';render()};
 $('#reset').onclick=()=>{db=structuredClone(seed);save();toast('Datos demo restablecidos')}
}
function shell(){let u=me();let items=navItems(u.role);return `<div class="app"><header class="top"><div class="topin"><div class="brand"><div class="mark">A</div><span>Amazonas Pole Academy</span></div><div class="spacer"></div><span class="pill">${u.role==='owner'?'Panel dueña':u.role==='teacher'?'Panel profesora':'Hola, '+esc(u.name)}</span><button class="btn ghost" id="logout">Salir</button></div></header><div class="layout"><aside class="side">${items.map(i=>`<button class="navbtn ${current===i[0]?'active':''}" data-nav="${i[0]}">${i[1]}</button>`).join('')}</aside><main class="content" id="page"></main></div><nav class="mobilebar">${items.slice(0,5).map(i=>`<button class="${current===i[0]?'active':''}" data-nav="${i[0]}">${i[1]}</button>`).join('')}</nav></div>`}
function bindNav(){$$('[data-nav]').forEach(b=>b.onclick=()=>{current=b.dataset.nav;renderPage()});$('#logout').onclick=()=>{session=null;localStorage.removeItem('amazonas_session');login()}}
function render(){if(!session||!me())return login();document.getElementById('root').innerHTML=shell();bindNav();renderPage()}
function renderPage(){let p=$('#page');if(!p)return;let role=me().role;let fn=pages[current]||pages[role==='owner'?'owner':role==='teacher'?'teacher':'home'];p.innerHTML=fn();bindPage();$$('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===current))}
function countClass(cid){return db.reservations.filter(r=>r.classId===cid&&r.status==='confirmed').length}
function myReservations(){return db.reservations.filter(r=>r.userId===me().id)}
function classCard(c,student=false){let n=countClass(c.id),full=n>=c.capacity, mine=db.reservations.find(r=>r.userId===me().id&&r.classId===c.id&&r.status==='confirmed');return `<div class="classrow"><div class="time">${c.time}</div><div><b>${esc(c.activity)}</b><div class="muted">con ${esc(c.teacher)} · ${n}/${c.capacity} cupos</div></div>${student?`<div class="actions">${mine?`<button class="btn bad" data-cancel="${mine.id}">Cancelar</button>`:`<button class="btn ${full?'ghost':'primary'}" data-reserve="${c.id}" ${full?'disabled':''}>${full?'Completa':'Reservar'}</button>`}</div>`:''}</div>`}
const pages={
 home:()=>{let u=me(),r=myReservations().find(x=>x.status==='confirmed'),c=r&&db.classes.find(x=>x.id===r.classId);return `<section class="hero"><div class="eyebrow">Academia de Pole · CABA</div><h1>¡Hola, ${esc(u.name)}!</h1><p>${c?`Tu próxima reserva: <b>${c.day} ${c.time} · ${c.activity}</b>`:'Todavía no tenés una reserva activa.'}</p><div class="actions"><button class="btn primary" data-nav="schedule">Reservar una clase</button><button class="btn ghost" data-nav="payments">Ver mi abono</button></div></section><div class="grid g3" style="margin-top:16px"><div class="card"><div class="eyebrow">Clases disponibles</div><div class="stat">${u.credits||0}</div><div class="muted">créditos en tu abono</div></div><div class="card"><div class="eyebrow">Mis reservas</div><div class="stat">${myReservations().filter(x=>x.status==='confirmed').length}</div><div class="muted">activas</div></div><div class="card"><div class="eyebrow">Novedades</div><div class="stat">${db.news.length}</div><div class="muted">publicadas</div></div></div><div class="sectionhead" style="margin-top:26px"><div><div class="eyebrow">#SomosAmazonas</div><h2>Fuerza, flexibilidad y vuelo</h2></div></div><div class="grid g2"><div class="card"><h3>Pole Sport</h3><p class="muted">Fuerza, coordinación, giros y trucos sobre la barra.</p></div><div class="card"><h3>Exotic Pole</h3><p class="muted">Danza, fluidez, expresión corporal y técnica.</p></div><div class="card"><h3>Flexibilidad</h3><p class="muted">Splits, espalda y movilidad con transferencia al Pole.</p></div><div class="card"><h3>Pole Yoga</h3><p class="muted">Movilidad, control corporal y bienestar.</p></div></div>`},
 schedule:()=>`<div class="sectionhead"><div><div class="eyebrow">Horarios</div><h2>Reservá tu clase</h2></div><span class="badge">${me().credits||0} créditos</span></div><div class="tabs">${['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'].map(d=>`<button class="tab ${day===d?'active':''}" data-day="${d}">${d}</button>`).join('')}</div><div class="notice" style="margin:8px 0 16px">Las reservas consumen 1 crédito. Si cancelás, el crédito vuelve a tu abono.</div><div class="schedule">${db.classes.filter(c=>c.day===day&&c.active).map(c=>classCard(c,true)).join('')||'<div class="empty">No hay clases este día.</div>'}</div>`,
 reservations:()=>`<div class="sectionhead"><div><div class="eyebrow">Mis Reservas</div><h2>Tu agenda</h2></div><button class="btn primary" data-nav="schedule">Reservar más</button></div><div class="list">${myReservations().map(r=>{let c=db.classes.find(x=>x.id===r.classId);return `<div class="item"><div><b>${c?esc(c.activity):'Clase eliminada'}</b><div class="muted">${c?`${c.day} ${c.time} · ${c.teacher}`:''}</div></div><div class="actions"><span class="badge ${r.attendance?'ok':r.status==='confirmed'?'ok':'bad'}">${r.attendance?'Asististe':r.status==='confirmed'?'Confirmada':'Cancelada'}</span>${r.status==='confirmed'&&!r.attendance?`<button class="btn bad" data-cancel="${r.id}">Cancelar</button>`:''}</div></div>`}).join('')||'<div class="empty">Todavía no tenés reservas.</div>'}</div>`,
 payments:()=>`<div class="sectionhead"><div><div class="eyebrow">Abonos y pagos</div><h2>Tu historial</h2></div><button class="btn primary" id="newPayment">＋ Registrar un pago</button></div><div class="card" style="margin-bottom:16px"><div class="profile"><div class="avatar">${me().name[0]}</div><div><b>${esc(me().plan||'Sin abono activo')}</b><div class="muted">${me().credits||0} clases disponibles ${me().expires?'· vence '+me().expires:''}</div></div></div></div><div class="list">${db.payments.filter(p=>p.userId===me().id).map(p=>`<div class="item"><div><b>${esc(p.plan)}</b><div class="muted">${money(p.amount)} · ${esc(p.method)} · ${p.date}</div>${p.receipt?'<small class="muted">Comprobante adjunto</small>':''}</div><span class="badge ${p.status==='approved'?'ok':p.status==='pending'?'warn':'bad'}">${p.status==='approved'?'Aprobado':p.status==='pending'?'Pendiente':'Rechazado'}</span></div>`).join('')}</div>`,
 news:()=>`<div class="sectionhead"><div><div class="eyebrow">Actividades y novedades</div><h2>Amazonas al día</h2></div></div><div class="grid g2">${db.news.map(n=>`<article class="card"><div style="font-size:28px">${n.tag}</div><h3>${esc(n.title)}</h3><p class="muted">${esc(n.message)}</p><small class="muted">${n.date}</small></article>`).join('')}</div>`,
 account:()=>`<div class="sectionhead"><div><div class="eyebrow">Mi cuenta</div><h2>${esc(me().name)} ${esc(me().last||'')}</h2></div></div><div class="grid g2"><div class="card"><form class="form" id="profileForm"><label>Nombre<input id="pfName" value="${esc(me().name)}"></label><label>Apellido<input id="pfLast" value="${esc(me().last||'')}"></label><label>WhatsApp<input id="pfPhone" value="${esc(me().phone||'')}"></label><button class="btn primary">Actualizar datos</button></form></div><div class="card"><h3>Estado del abono</h3><div class="stat">${me().credits||0}</div><p class="muted">clases disponibles</p><button class="btn soft" data-nav="payments">Gestionar abonos</button></div></div>`,
 credential:()=>`<div class="sectionhead"><div><div class="eyebrow">Tu credencial</div><h2>Mostrala para registrar tu asistencia</h2></div></div><div class="card" style="max-width:480px;text-align:center"><div id="qr" class="qrbox" style="margin:10px auto 18px"></div><h3>${esc(me().name)} ${esc(me().last||'')}</h3><p class="muted">ID: ${me().id} · ${me().credits||0} clases disponibles</p><div class="notice">Código de asistencia: <b>${me().id.toUpperCase()}-${checksum(me().id)}</b></div></div>`,
 transfer:()=>`<div class="sectionhead"><div><div class="eyebrow">Transferencia</div><h2>Datos de pago</h2></div></div><div class="card" style="max-width:650px"><div class="list"><div class="item"><span>Alias</span><b>${esc(db.studio.alias)}</b></div><div class="item"><span>CBU</span><b>${esc(db.studio.cbu)}</b></div><div class="item"><span>Titular</span><b>${esc(db.studio.owner)}</b></div></div><p class="notice" style="margin-top:14px">Después de transferir, registrá el pago en <b>Abonos y Pagos</b> y adjuntá el comprobante.</p></div>`,
 owner:()=>`<div class="sectionhead"><div><div class="eyebrow">Panel Dueña</div><h2>Buen día, ${esc(me().name)} ✨</h2></div></div><div class="grid g3"><div class="card"><div class="stat">${db.payments.filter(p=>p.status==='pending').length}</div><div class="muted">Pagos por aprobar</div></div><div class="card"><div class="stat">${db.reservations.filter(r=>r.status==='confirmed').length}</div><div class="muted">Reservas activas</div></div><div class="card"><div class="stat">${db.users.filter(u=>u.role==='student').length}</div><div class="muted">Alumnas registradas</div></div></div><div class="grid g2" style="margin-top:16px">${[['approve','Aprobar pagos','Validá transferencias y activá abonos'],['capacity','Cupos por clase','Reservas y disponibilidad'],['manage','Gestionar horarios','Clases, profes y cupos'],['scan','Escanear QR','Registrar asistencia'],['students','Alumnas','Cuentas y abonos'],['publish','Enviar novedad','Avisos a las alumnas']].map(x=>`<button class="card" data-nav="${x[0]}" style="text-align:left;cursor:pointer"><h3>${x[1]}</h3><p class="muted">${x[2]}</p></button>`).join('')}</div>`,
 approve:()=>`<div class="sectionhead"><div><div class="eyebrow">Administración</div><h2>Aprobar pagos</h2></div></div><div class="list">${db.payments.filter(p=>p.status==='pending').map(p=>{let u=db.users.find(x=>x.id===p.userId);return `<div class="item"><div><b>${esc(u?.name||'Alumna')} ${esc(u?.last||'')}</b><div>${esc(p.plan)} · ${money(p.amount)} · ${esc(p.method)}</div>${p.receipt?`<small><a href="${p.receipt}" target="_blank">Ver comprobante</a></small>`:'<small class="muted">Sin comprobante</small>'}</div><div class="actions"><button class="btn ok" data-approve="${p.id}">Aprobar</button><button class="btn bad" data-reject="${p.id}">Rechazar</button></div></div>`}).join('')||'<div class="empty">No hay pagos pendientes.</div>'}</div>`,
capacity:()=>`<div class="sectionhead">
  <div>
    <div class="eyebrow">Cupos</div>
    <h2>Cupos por clase</h2>
  </div>
</div>

<div class="schedule">
${db.classes.filter(c=>c.active).map(c=>{
  let n=countClass(c.id);

  return `
    <div class="classrow">
      <div class="time">${c.time}</div>

      <div>
        <b>${c.day} · ${esc(c.activity)}</b>
        <div class="muted">
          ${esc(c.teacher)} · ${n}/${c.capacity}
        </div>

        <div class="progress" style="margin-top:8px">
          <span style="width:${Math.min(100,n/c.capacity*100)}%"></span>
        </div>
      </div>

      <div class="actions">
        <span class="badge ${n>=c.capacity?'bad':'ok'}">
          ${n>=c.capacity?'Lleno':c.capacity-n+' libres'}
        </span>

        <button class="btn soft" data-viewstudents="${c.id}">
          Ver alumnas
        </button>
      </div>
    </div>
  `;
}).join('')}
</div>`, manage:()=>`<div class="sectionhead"><div><div class="eyebrow">Horarios</div><h2>Gestionar horarios</h2></div><button class="btn primary" id="newClass">Nueva clase</button></div><div class="tablewrap"><table><thead><tr><th>Día</th><th>Hora</th><th>Actividad</th><th>Profe</th><th>Cupo</th><th></th></tr></thead><tbody>${db.classes.map(c=>`<tr><td>${c.day}</td><td>${c.time}</td><td>${esc(c.activity)}</td><td>${esc(c.teacher)}</td><td>${c.capacity}</td><td class="right"><button class="btn ghost" data-editclass="${c.id}">Editar</button> <button class="btn bad" data-toggleclass="${c.id}">${c.active?'Ocultar':'Activar'}</button></td></tr>`).join('')}</tbody></table></div>`,
 students:()=>`<div class="sectionhead"><div><div class="eyebrow">Alumnas</div><h2>Alumnas registradas</h2></div></div><div class="tablewrap"><table><thead><tr><th>Nombre</th><th>Email</th><th>WhatsApp</th><th>Abono</th><th>Créditos</th></tr></thead><tbody>${db.users.filter(u=>u.role==='student').map(u=>`<tr><td>${esc(u.name)} ${esc(u.last||'')}</td><td>${esc(u.email)}</td><td>${esc(u.phone||'')}</td><td>${esc(u.plan||'—')}</td><td>${u.credits||0}</td></tr>`).join('')}</tbody></table></div>`,
 studio:()=>`<div class="sectionhead"><div><div class="eyebrow">Configuración</div><h2>Datos del estudio</h2></div></div><div class="card"><form class="form" id="studioForm"><div class="grid g2"><label>Titular<input id="stOwner" value="${esc(db.studio.owner)}"></label><label>Alias<input id="stAlias" value="${esc(db.studio.alias)}"></label><label>CBU<input id="stCbu" value="${esc(db.studio.cbu)}"></label><label>WhatsApp<input id="stWa" value="${esc(db.studio.whatsapp)}"></label><label>Instagram<input id="stIg" value="${esc(db.studio.instagram)}"></label><label>Dirección<input id="stAddr" value="${esc(db.studio.address)}"></label></div><button class="btn primary">Guardar cambios</button></form></div>`,
 scan:()=>scanPage('Escanear QR'),
 publish:()=>`<div class="sectionhead"><div><div class="eyebrow">Novedades</div><h2>Enviar novedad</h2></div></div><div class="grid g2"><div class="card"><form class="form" id="newsForm"><label>Etiqueta<select id="nTag"><option>🔥</option><option>🩰</option><option>🎉</option><option>📣</option></select></label><label>Título<input id="nTitle" required placeholder="Ej: Nuevo horario de Exotic"></label><label>Mensaje<textarea id="nMsg" required></textarea></label><button class="btn primary">Publicar a las alumnas</button></form></div><div class="card"><h3>Publicadas</h3><div class="list">${db.news.map(n=>`<div><b>${n.tag} ${esc(n.title)}</b><div class="muted">${n.date}</div></div>`).join('')}</div></div></div>`,
 teachers:()=>`<div class="sectionhead"><div><div class="eyebrow">Plantel</div><h2>Profesoras</h2></div><button class="btn primary" id="addTeacher">Agregar profesora</button></div><div class="grid g2">${db.teachers.map(t=>`<div class="card"><div class="profile"><div class="avatar">${t.name.split(' ').map(x=>x[0]).slice(0,2).join('')}</div><div><b>${esc(t.name)}</b><div class="muted">${esc(t.disc)}</div><span class="badge">${t.role}</span></div></div></div>`).join('')}</div>`,
 teacher:()=>{let n=db.classes.filter(c=>c.teacher.toLowerCase().includes(me().name.toLowerCase())&&c.active).length;return `<div class="sectionhead"><div><div class="eyebrow">Panel Profesora</div><h2>Hola, ${esc(me().name)} 👋</h2></div></div><div class="grid g3"><div class="card"><div class="stat">${n}</div><div class="muted">Clases asignadas</div></div><div class="card"><div class="stat">${teacherBookings()}</div><div class="muted">Alumnas anotadas</div></div><div class="card"><div class="stat">${db.attendance.filter(a=>a.teacherId===me().id).length}</div><div class="muted">Asistencias tomadas</div></div></div><div class="notice" style="margin-top:16px">Como profesora ves tus clases y registrás asistencia. Los pagos y la configuración los maneja la dueña.</div>`},
 myclasses:()=>`<div class="sectionhead"><div><div class="eyebrow">Mis clases</div><h2>Tu semana</h2></div></div><div class="schedule">${db.classes.filter(c=>c.teacher.toLowerCase().includes(me().name.toLowerCase())&&c.active).map(c=>classCard(c,false)).join('')||'<div class="empty">No tenés clases asignadas en los datos demo.</div>'}</div>`,
 attendance:()=>scanPage('Tomar asistencia')
};
function teacherBookings(){let ids=db.classes.filter(c=>c.teacher.toLowerCase().includes(me().name.toLowerCase())).map(c=>c.id);return db.reservations.filter(r=>ids.includes(r.classId)&&r.status==='confirmed').length}
function scanPage(title){return `<div class="sectionhead"><div><div class="eyebrow">Asistencia</div><h2>${title}</h2></div></div><div class="card" style="max-width:600px"><p class="muted">Ingresá el código que aparece en la credencial de la alumna.</p><form class="form" id="scanForm"><label>Código de credencial<input id="scanCode" placeholder="U1-..." required></label><button class="btn primary">Registrar asistencia</button></form><div class="notice" style="margin-top:14px">En producción este módulo puede conectarse con la cámara del teléfono. Esta copia funcional usa el mismo token de la credencial para validar la asistencia.</div></div>`}
function checksum(s){let n=0;for(let c of s)n=(n*31+c.charCodeAt(0))%997;return String(n).padStart(3,'0')}
function qrDraw(){let q=$('#qr');if(!q)return;let token=me().id+'-'+checksum(me().id),bits=[];let seedN=[...token].reduce((a,c)=>a+c.charCodeAt(0),0);for(let i=0;i<441;i++){seedN=(seedN*9301+49297)%233280;bits.push(seedN/233280>.5)};for(let y=0;y<21;y++)for(let x=0;x<21;x++){let i=document.createElement('i');let finder=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);let on=finder?((x%6===0||y%6===0||((x%6>=2&&x%6<=4)&&(y%6>=2&&y%6<=4)))):bits[y*21+x];if(on)i.className='on';q.append(i)}}
function modal(html){let m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modalbox">${html}</div>`;m.onclick=e=>{if(e.target===m)m.remove()};document.body.append(m);return m}
function paymentModal(){let m=modal(`<div class="sectionhead"><div><div class="eyebrow">Nuevo pago</div><h2>Registrar un pago</h2></div><button class="btn ghost" id="closeM">×</button></div><form class="form" id="payForm"><label>Abono<select id="payPlan">${db.plans.map((p,i)=>`<option value="${i}">${p.name} · ${money(p.amount)}</option>`).join('')}</select></label><label>Método<select id="payMethod"><option>Transferencia</option><option>Efectivo</option></select></label><label>Comprobante (imagen o PDF)<input id="receipt" type="file" accept="image/*,application/pdf"></label><button class="btn primary">Enviar para aprobación</button></form>`);m.querySelector('#closeM').onclick=()=>m.remove();m.querySelector('#payForm').onsubmit=e=>{e.preventDefault();let p=db.plans[+m.querySelector('#payPlan').value],file=m.querySelector('#receipt').files[0];let finish=receipt=>{db.payments.unshift({id:'p'+Date.now(),userId:me().id,plan:p.name,amount:p.amount,method:m.querySelector('#payMethod').value,date:new Date().toISOString().slice(0,10),status:'pending',receipt,credits:p.credits});save();m.remove();toast('Pago registrado. Queda pendiente de aprobación.');renderPage()};if(file){if(file.size>900000)return toast('Para esta demo, el comprobante debe pesar menos de 900 KB');let rd=new FileReader();rd.onload=()=>finish(rd.result);rd.readAsDataURL(file)}else finish('')}}
function classModal(c){let editing=!!c,m=modal(`<div class="sectionhead"><div><div class="eyebrow">Horario</div><h2>${editing?'Editar':'Nueva'} clase</h2></div><button class="btn ghost" id="closeM">×</button></div><form class="form" id="classForm"><label>Día<select id="cDay">${['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'].map(d=>`<option ${c?.day===d?'selected':''}>${d}</option>`).join('')}</select></label><label>Hora<input id="cTime" type="time" value="${c?.time||'18:30'}" required></label><label>Actividad<input id="cAct" value="${esc(c?.activity||'Pole Sport')}" required></label><label>Profesora<input id="cTeacher" value="${esc(c?.teacher||'')}" required></label><label>Cupo<input id="cCap" type="number" min="1" max="30" value="${c?.capacity||6}" required></label><button class="btn primary">Guardar</button></form>`);m.querySelector('#closeM').onclick=()=>m.remove();m.querySelector('#classForm').onsubmit=e=>{e.preventDefault();let obj={day:m.querySelector('#cDay').value,time:m.querySelector('#cTime').value,activity:m.querySelector('#cAct').value,teacher:m.querySelector('#cTeacher').value,capacity:+m.querySelector('#cCap').value,active:true};if(editing)Object.assign(c,obj);else db.classes.push({id:'c'+Date.now(),...obj});save();m.remove();toast('Horario guardado');renderPage()}}
function bindPage(){$$('[data-viewstudents]').forEach(b=>{
  b.onclick=()=>classStudentsModal(b.dataset.viewstudents);
});
 $$('[data-nav]').forEach(b=>b.onclick=()=>{current=b.dataset.nav;renderPage()});
 $$('[data-day]').forEach(b=>b.onclick=()=>{day=b.dataset.day;renderPage()});
 $$('[data-reserve]').forEach(b=>b.onclick=()=>{let u=me();if((u.credits||0)<1)return toast('Necesitás un abono con clases disponibles');let cid=b.dataset.reserve,c=db.classes.find(x=>x.id===cid);if(countClass(cid)>=c.capacity)return toast('La clase ya está completa');db.reservations.push({id:'r'+Date.now(),userId:u.id,classId:cid,status:'confirmed',attendance:false,created:new Date().toISOString().slice(0,10)});u.credits--;save();toast('Reserva confirmada');renderPage()});
 $$('[data-cancel]').forEach(b=>b.onclick=()=>{let r=db.reservations.find(x=>x.id===b.dataset.cancel);if(r&&r.status==='confirmed'){r.status='cancelled';me().credits=(me().credits||0)+1;save();toast('Reserva cancelada. Recuperaste 1 crédito.');renderPage()}});
 $('#newPayment')&&($('#newPayment').onclick=paymentModal);qrDraw();
 $('#profileForm')&&($('#profileForm').onsubmit=e=>{e.preventDefault();Object.assign(me(),{name:$('#pfName').value,last:$('#pfLast').value,phone:$('#pfPhone').value});save();toast('Datos actualizados');render()});
 $$('[data-approve]').forEach(b=>b.onclick=()=>{let p=db.payments.find(x=>x.id===b.dataset.approve),u=db.users.find(x=>x.id===p.userId);p.status='approved';u.credits=(u.credits||0)+(p.credits||0);u.plan=p.plan;let d=new Date();d.setDate(d.getDate()+30);u.expires=d.toISOString().slice(0,10);save();toast('Pago aprobado y abono activado');renderPage()});
 $$('[data-reject]').forEach(b=>b.onclick=()=>{let p=db.payments.find(x=>x.id===b.dataset.reject);p.status='rejected';save();toast('Pago rechazado');renderPage()});
 $('#newClass')&&($('#newClass').onclick=()=>classModal(null));$$('[data-editclass]').forEach(b=>b.onclick=()=>classModal(db.classes.find(x=>x.id===b.dataset.editclass)));$$('[data-toggleclass]').forEach(b=>b.onclick=()=>{let c=db.classes.find(x=>x.id===b.dataset.toggleclass);c.active=!c.active;save();renderPage()});
 $('#studioForm')&&($('#studioForm').onsubmit=e=>{e.preventDefault();Object.assign(db.studio,{owner:$('#stOwner').value,alias:$('#stAlias').value,cbu:$('#stCbu').value,whatsapp:$('#stWa').value,instagram:$('#stIg').value,address:$('#stAddr').value});save();toast('Datos del estudio guardados')});
 $('#newsForm')&&($('#newsForm').onsubmit=e=>{e.preventDefault();db.news.unshift({id:'n'+Date.now(),tag:$('#nTag').value,title:$('#nTitle').value,message:$('#nMsg').value,date:new Date().toISOString().slice(0,10)});save();toast('Novedad publicada');renderPage()});
 $('#addTeacher')&&($('#addTeacher').onclick=()=>{let m=modal(`<h2>Agregar profesora</h2><form class="form" id="tForm"><label>Nombre<input id="tName" required></label><label>Disciplinas<input id="tDisc" required></label><button class="btn primary">Agregar</button></form>`);m.querySelector('#tForm').onsubmit=e=>{e.preventDefault();db.teachers.push({id:'t'+Date.now(),name:m.querySelector('#tName').value,disc:m.querySelector('#tDisc').value,role:'Profe'});save();m.remove();renderPage()}});
 $('#scanForm')&&($('#scanForm').onsubmit=e=>{e.preventDefault();let code=$('#scanCode').value.trim().toLowerCase(),uid=code.split('-')[0],u=db.users.find(x=>x.id.toLowerCase()===uid&&x.role==='student');if(!u||code!==`${u.id}-${checksum(u.id)}`.toLowerCase())return toast('Credencial no válida');let rs=db.reservations.filter(r=>r.userId===u.id&&r.status==='confirmed'&&!r.attendance);if(!rs.length)return toast('La alumna no tiene reservas pendientes de asistencia');let r=rs[0];r.attendance=true;db.attendance.push({id:'a'+Date.now(),userId:u.id,reservationId:r.id,teacherId:me().id,date:new Date().toISOString()});save();toast('Asistencia registrada para '+u.name);renderPage()});
}
render();
</script>
</body></html>
